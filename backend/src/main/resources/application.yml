server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: express-station-backend

  # ==================== 运行环境 ====================
  # 默认激活 dev 环境：数据库账号密码等本地敏感配置放在 application-dev.yml 中，
  # 该文件已加入 .gitignore，不会提交到代码仓库。
  # 新克隆项目后，请复制 application-dev.yml.example 为 application-dev.yml 并填写自己的密码。
  profiles:
    active: dev

  # ==================== 数据源配置 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/express_station?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # 账号密码优先读取环境变量 MYSQL_USERNAME / MYSQL_PASSWORD；
    # 若未设置环境变量，则由 application-dev.yml 覆盖（推荐做法）。
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ExpressStationHikariPool

  # ==================== JSON 序列化 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

  mvc:
    throw-exception-if-no-handler-found: true

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wuyuhang.delivery.entity
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    # 开发阶段打印 SQL，便于调试；上线可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 全局逻辑删除配置，与表结构中的 deleted 字段对应
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== JWT 配置 ====================
jwt:
  # HS256 要求密钥长度不少于 256 bit，这里使用足够长的自定义字符串
  secret: express-station-management-system-jwt-secret-key-2026-wuyuhang-graduation-design
  # 令牌有效期（秒）：24 小时
  expiration: 86400
  header: Authorization
  prefix: "Bearer "

# ==================== 验证码 / 短信（找回密码） ====================
# 设计：把"发送通道"抽象成 SmsSender 接口，业务代码只依赖接口，
# 换通道（只记日志 / 发邮件 / 发真实短信）不需要改业务逻辑。
#
#   provider: mock   默认值。只写日志并把验证码回传到接口响应，零成本、无需审核，
#                    方便本地开发与答辩演示。
#   provider: mail   通过邮箱 SMTP 真实投递（成本为零、无需审核，适合毕业设计演示）。
#                    需在 application-dev.yml 配置 spring.mail.* 与 sms.mail.to。
#   provider: aliyun 阿里云短信真实发送。需先在控制台申请通过「签名」与「模板」，
#                    并配置 AK/SK（建议用环境变量注入，不要写进仓库）。
sms:
  provider: ${SMS_PROVIDER:mock}
  code-length: 6
  # 有效期（分钟）
  expire-minutes: 5
  # 验证码最多允许输错次数，超过即失效
  max-attempts: 5
  # 同一手机号两次发送的最小间隔（秒）
  interval-seconds: 60
  # 同一手机号每天最多发送次数
  daily-limit: 10
  # 演示开关：仅当 provider=mock 时生效，把验证码回传到接口响应里。
  # 生产环境必须设为 false（等于把验证码直接告诉调用方）。
  expose-code-in-response: true

  mail:
    # 演示收件邮箱：所有验证码统一投递到这里（用环境变量或 application-dev.yml 配置）
    to: ${SMS_MAIL_TO:}
    # 发件人地址，必须与 spring.mail.username（认证账号）一致，
    # 否则 QQ/163 等邮箱会报 501 Mail from address must be same as authorization user
    from: ${spring.mail.username:}
    subject: 【快递驿站系统】找回密码验证码
    from-name: 快递驿站快件收发管理系统

  aliyun:
    # 建议通过环境变量注入，切勿提交到代码仓库
    access-key-id: ${SMS_ALIYUN_AK_ID:}
    access-key-secret: ${SMS_ALIYUN_AK_SECRET:}
    # 短信签名与模板需在阿里云控制台申请并通过审核
    sign-name: ${SMS_ALIYUN_SIGN_NAME:}
    template-code: ${SMS_ALIYUN_TEMPLATE_CODE:}
    region-id: cn-hangzhou
    template-param-name: code
# ==================== 接口文档 ====================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

# ==================== 日志 ====================
logging:
  level:
    root: info
    com.wuyuhang.delivery: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
